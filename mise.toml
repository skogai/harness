# Declarative environment for this meta-repo (https://mise.jdx.dev).
# This dir is the dev/overview environment, not a shipped artifact — actual
# products (and their own tests) live one level down, e.g. in marketplace/.
#
# Fresh clone:
#   mise trust && mise install
#
# Machine-wide settings (SKOGAI_MODE, workstation paths, secrets such as
# SKOGAI_GH_TOKEN) belong in ~/.config/mise/config.toml or a gitignored
# .env / mise.local.toml — never in this file.

[tools]
node = "26"
bun = "1.3.14"
python = "3.14"
uv = "latest"
usage = "latest"

[env]
# Create and activate the project venv automatically (replaces the
# `source_env .venv/bin/activate` line from .envrc).
_.python.venv = { path = ".venv", create = true }
# Optional machine-local overrides and secrets, gitignored.
_.file = ".env"

[tasks.install-skogcli]
run = "uv tool install git+https://github.com/skogai/cli"
